defaults:
  - _self_

experiment: ??? # tag for wandb and log dir

hydra:
  run:
    dir: ./results/policy/${experiment}_${now:%m%d_%H%M}_s${seed}
  sweep:
    dir: ./results/policy/${experiment}_${now:%m%d_%H%M}_s${seed}
    subdir: ${hydra.job.num}

wandb:
  project: atm_robotwin_policy
  name: ${experiment}_${now:%m%d_%H%M}_s${seed}
  group: ${experiment}

train_gpus: [0, 1]
strategy: ddp

# Training. Values follow Table VIII of the ATM paper.
# batch_size is per-device and Fabric shards the dataloader, so on 2 GPUs this is the paper's 512.
lr: 5e-4
batch_size: 256
# bf16 is needed to fit the paper's batch size on a 48GB A6000: at fp32, 256/device needs ~50GB.
# Precision is not specified in the paper's table, whereas batch size is, so precision gives way.
mix_precision: true
num_workers: 8
val_freq: 5
save_freq: 10
clip_grad: 100.
epochs: 100
seed: 0
dry: false

img_size: 128
frame_stack: 10
num_track_ts: 16
num_track_ids: 32
extra_state_keys: ["left_arm_states", "right_arm_states"]

aug_prob: 0.9

train_dataset: ???
val_dataset: ???
val_num_demos: null

# RoboTwin evaluation is driven by RoboTwin's own evaluator (RoboTwin/policy/ATM), so no rollout
# environment is built during training. An empty env_name makes build_env a no-op.
env_cfg:
  env_type: robotwin
  render_gpu_ids: 0
  vec_env_num: 10
  horizon: 500
  env_name: []
  task_name: []
  env_meta_fn: []

optimizer_cfg:
  type: optim.AdamW
  params:
    lr: ${lr}
    weight_decay: 1e-4

scheduler_cfg:
  type: CosineAnnealingLR
  params:
    T_max: ${epochs}
    eta_min: 0.
    last_epoch: -1

model_name: BCViLTPolicy
model_cfg:
  load_path: null
  obs_cfg:
    obs_shapes:
      rgb: [3, 128, 128]
      tracks: [16, 32, 2]
    img_mean: [ 0., 0., 0. ]
    img_std: [ 1.0, 1.0, 1.0 ]
    num_views: 1
    extra_states: ${extra_state_keys}
    max_seq_len: ${frame_stack}
  img_encoder_cfg:
    network_name: PatchEncoder
    patch_size: [8, 8]
    embed_size: 128
    no_patch_embed_bias: false
  language_encoder_cfg:
    network_name: MLPEncoder
    input_size: 768
    hidden_size: 128
    num_layers: 1
  extra_state_encoder_cfg:
    extra_num_layers: 0
    extra_hidden_size: 128
    arm_states_dim: 8  # xyz(3) + wxyz quaternion(4) + gripper(1)
  track_cfg:
    track_fn: ???
    policy_track_patch_size: 16
    use_zero_track: false
  spatial_transformer_cfg:
    num_layers: 7
    num_heads: 8
    head_output_size: 120
    mlp_hidden_size: 256
    dropout: 0.1
    spatial_downsample: true
    spatial_downsample_embed_size: 64
    use_language_token: false
  temporal_transformer_cfg:
    num_layers: 4
    num_heads: 6
    head_output_size: 64
    mlp_hidden_size: 256
    dropout: 0.1
    use_language_token: false
  policy_head_cfg:
    network_name: DeterministicHead
    output_size: [16,]  # [left absolute pose(7), gripper, right absolute pose(7), gripper]
    hidden_size: 1024
    num_layers: 2
    loss_coef: 1.0
    action_squash: false

dataset_cfg:
  img_size: ${img_size}
  frame_stack: ${frame_stack}
  num_track_ts: ${num_track_ts}
  num_track_ids: ${num_track_ids}
  track_obs_fs: 1
  augment_track: false
  extra_state_keys: ${extra_state_keys}
  cache_all: true
  cache_image: true
